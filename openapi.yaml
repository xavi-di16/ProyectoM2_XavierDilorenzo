                $ref: '#/components/schemas/DeletePostResponse'
        '404':
          description: Post no encontrado para eliminar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/author/{authorId}:
    get:
      tags: [Posts]
      summary: Obtener los posts de un autor
      parameters:
        - name: authorId
          in: path
          required: true
          description: ID del autor
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de posts del autor (vacía si no tiene posts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
  /comments/post/{postId}:
    get:
      tags: [Comments]
      summary: Obtener los comentarios de un post
      description: Devuelve los comentarios del post ordenados del más antiguo al más reciente (`created_at`).
      parameters:
        - name: postId
          in: path
          required: true
          description: ID del post (entero positivo, máximo 2147483647)
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Lista de comentarios del post (vacía si no tiene comentarios)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          description: El `postId` no es un número entero positivo válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /comments:
    post:
      tags: [Comments]
      summary: Crear un nuevo comentario
      description: Crea un comentario asociado a un post y a un autor existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
            example:
              content: Excelente publicación, muy útil.
              post_id: 1
              author_id: 2
      responses:
        '201':
          description: Comentario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: >
            Petición inválida: cuerpo vacío, `content` con menos de 3 caracteres, `post_id` o `author_id`
            ausentes o fuera del rango de enteros positivos (1 a 2147483647), o el post/autor no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: ID del recurso
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Autor no encontrado
        status:
          type: integer
          example: 404
    Author:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        bio:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuthorInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
        bio:
          type: string
          nullable: true
    AuthorUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
        bio:
          type: string
          nullable: true
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
        published:
          type: boolean
        created_at:
          type: string
          format: date-time
    PostInput:
      type: object
      required: [title, content, author_id]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        content:
          type: string
          minLength: 10
        author_id:
          type: integer
          minimum: 1
        published:
          type: boolean
    PostUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        content:
          type: string
          minLength: 10
        published:
          type: boolean
    DeleteAuthorResponse:
      type: object
      properties:
        mensaje:
          type: string
        registro_eliminado:
          $ref: '#/components/schemas/Author'
    DeletePostResponse:
      type: object
      properties:
        mensaje:
          type: string
        registro_eliminado:
          $ref: '#/components/schemas/Post'
    CommentInput:
      type: object
      required: [content, post_id, author_id]
      properties:
        content:
          type: string
          minLength: 3
        post_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        author_id:
          type: integer
          minimum: 1
          maximum: 2147483647
    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        post_id:
          type: integer
        author_id:
          type: integer
        created_at:
          type: string
          format: date-time
