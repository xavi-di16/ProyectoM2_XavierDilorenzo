    put:
      tags: [Posts]
      summary: Actualizar un post
      description: Actualización parcial. Debe enviarse al menos uno de los campos `title`, `content` o `published`. El `author_id` no se puede modificar.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
